# Copy to /etc/nginx/sites-available/imax, replace YOUR_DOMAIN, then run certbot (it adds the HTTPS server block).
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/imax/current;      # the frontend release `npm run deploy` activates
    index index.html;
    client_max_body_size 10m;

    # Django: API, admin and its static files. Everything under these paths is proxied to gunicorn.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # Django needs this to know the request was HTTPS
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise users keep an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: any other path serves the app and the router takes over.
    location / {
        try_files $uri /index.html;
    }

    # NOTE: no X-Frame-Options header here on purpose, so the app can be embedded inside GoHighLevel.
}
